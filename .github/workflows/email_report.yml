name: Send Email

on:
  workflow_run:
    workflows: ["Refresh Metrics"]   # must match name: in refresh_metrics.yml exactly
    types: [completed]

  workflow_dispatch:                 # optional: lets you test the email workflow manually

jobs:
  send-email:
    # Runs automatically ONLY when the Refresh Metrics workflow
    # was triggered manually AND finished successfully.
    # The extra github.event_name check allows manual test runs of this workflow.
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send email
        run: python send_email_report.py
        env:
          SMTP_SERVER:   ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
          # ... add any other env vars your email script needs
