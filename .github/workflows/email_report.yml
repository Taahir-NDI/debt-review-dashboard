name: Send Email

on:
  workflow_run:
    workflows: ["Refresh Metrics"]    # must match name: above exactly
    types: [completed]
  workflow_dispatch:                   # for manual testing

jobs:
  send-email:
    # Runs on:
    #   - a manual run of this workflow, OR
    #   - any Refresh Metrics run that completed successfully
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send email
        run: python send_email_sendgrid.py
        env:
          SENDGRID_API_KEY:              ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL:                    ${{ secrets.FROM_EMAIL }}
          TO_EMAIL:                      ${{ secrets.TO_EMAIL }}
          TO_EMAIL_SMS:                  ${{ secrets.TO_EMAIL_SMS }}
          DASHBOARD_URL:                 ${{ secrets.DASHBOARD_URL }}
          FOLDER_ID:                     ${{ secrets.FOLDER_ID }}
          PROJECT_ID:                    ${{ secrets.PROJECT_ID }}
          PRIVATE_KEY_ID:                ${{ secrets.PRIVATE_KEY_ID }}
          PRIVATE_KEY:                   ${{ secrets.PRIVATE_KEY }}
          CLIENT_EMAIL:                  ${{ secrets.CLIENT_EMAIL }}
          CLIENT_ID:                     ${{ secrets.CLIENT_ID }}
          AUTH_URI:                      ${{ secrets.AUTH_URI }}
          TOKEN_URI:                     ${{ secrets.TOKEN_URI }}
          AUTH_PROVIDER_X509_CERT_URL:   ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
          CLIENT_X509_CERT_URL:          ${{ secrets.CLIENT_X509_CERT_URL }}
