name: Send Daily Email Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install sendgrid

      - name: Send email via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python -c "
          import os
          from sendgrid import SendGridAPIClient
          from sendgrid.helpers.mail import Mail

          message = Mail(
              from_email='${{ secrets.FROM_EMAIL }}',
              to_emails=os.environ['TO_EMAIL'],
              subject='📊 Debt Review Report - $(date +'%d %b %Y')',
              html_content=f'<h1>Debt Review Dashboard Report</h1><p>View the full dashboard at: <a href=\"{os.environ['DASHBOARD_URL']}\">{os.environ['DASHBOARD_URL']}</a></p>'
          )
          sg = SendGridAPIClient(os.environ['SENDGRID_API_KEY'])
          response = sg.send(message)
          print(f'✅ Email sent, status code: {response.status_code}')
          "
