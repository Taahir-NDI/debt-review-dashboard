name: Send Email

on:
  workflow_run:
    workflows: ["Refresh Metrics"]     # must match name: in refresh_metrics.yml exactly
    types: [completed]

  workflow_dispatch:

jobs:
  send-email:
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug env
        run: |
          echo "SMTP_SERVER set?    ${{ secrets.SMTP_SERVER != '' }}"
          echo "SMTP_PORT set?      ${{ secrets.SMTP_PORT != '' }}"
          echo "SMTP_USER set?      ${{ secrets.SMTP_USER != '' }}"
          echo "SMTP_PASSWORD set?  ${{ secrets.SMTP_PASSWORD != '' }}"
          echo "EMAIL_FROM set?     ${{ secrets.EMAIL_FROM != '' }}"
          echo "EMAIL_TO set?       ${{ secrets.EMAIL_TO != '' }}"
          echo "TO_EMAIL_SMS set?   ${{ secrets.TO_EMAIL_SMS != '' }}"

      - name: List files in repo (debug)
        run: ls -la && echo "---" && ls -la *.xlsx *.csv 2>/dev/null || true

      - name: Send email
        run: python send_email_report.py
        env:
          SMTP_SERVER:   ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
          TO_EMAIL_SMS:  ${{ secrets.TO_EMAIL_SMS }}
