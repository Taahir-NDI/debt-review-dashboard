name: Send Email

on:
  workflow_run:
    workflows: ["Refresh Metrics"]     # must match name: in refresh_metrics.yml exactly
    types: [completed]

  workflow_dispatch:                    # allows manual testing of the email job

jobs:
  send-email:
    # Fires when either:
    #   1. You manually trigger this workflow, OR
    #   2. A Refresh Metrics run finished successfully
    #      (whether that run was manual OR scheduled)
    # Failed or cancelled refreshes do NOT fire the email.
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug env
        run: |
          echo "SMTP_SERVER set?   ${{ secrets.SMTP_SERVER != '' }}"
          echo "SMTP_PORT set?     ${{ secrets.SMTP_PORT != '' }}"
          echo "SMTP_USER set?     ${{ secrets.SMTP_USER != '' }}"
          echo "SMTP_PASSWORD set? ${{ secrets.SMTP_PASSWORD != '' }}"
          echo "EMAIL_FROM set?    ${{ secrets.EMAIL_FROM != '' }}"
          echo "EMAIL_TO set?      ${{ secrets.EMAIL_TO != '' }}"

      - name: Send email
        run: python send_email_report.py
        env:
          SMTP_SERVER:   ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
