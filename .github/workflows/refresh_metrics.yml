name: Refresh Metrics

on:
  workflow_dispatch:        # ← REQUIRED: enables manual trigger
  schedule:
    - cron: '0 6 * * *'    # optional: keep or remove

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh metrics
        run: python refresh_metrics.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # ... any other env vars your refresh script needs
